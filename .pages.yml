media:
  - name: images
    label: 图片
    input: static/images
    output: /images
    rename: safe
    extensions: [png, jpg, jpeg, webp, gif, svg]

content:
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    exclude: ["_index.md"]
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, draft, categories]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        options:
          maxlength: 120
      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: draft
        label: 草稿
        type: boolean
        default: true
      - name: featured
        label: 首页推荐
        type: boolean
        default: false
      - name: description
        label: 摘要
        type: text
        description: 显示在列表和搜索结果中，建议 60-120 字。
        options:
          maxlength: 200
      - name: categories
        label: 分类
        type: select
        options:
          multiple: true
          values:
            - 自动化测试
            - 测试开发
            - 质量工程
            - CI/CD
            - Agent 评测
            - 工程效率
      - name: tags
        label: 标签
        type: string
        list: true
        description: 每行一个标签，例如 pytest、fixture、接口测试。
      - name: cover
        label: 封面图
        type: image
        description: 可选，用作首页推荐和列表缩略图。
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          media: images
          switcher: true

  - name: about
    label: 关于页面
    type: file
    path: content/about.md
    operations:
      delete: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 页面描述
        type: text
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          media: images
          switcher: true
