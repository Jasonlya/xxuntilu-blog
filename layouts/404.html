{{ define "main" }}
<section class="error-page">
  <div class="error-card">
    <p class="error-code">404</p>
    <h1>这个页面不存在</h1>
    <p>链接可能已经失效，或者文章还没有发布。</p>
    <div class="hero-links">
      <a class="btn primary" href="{{ site.Home.RelPermalink }}">回到首页</a>
      <a class="btn" href="{{ "posts/" | relLangURL }}">浏览文章</a>
    </div>
  </div>
</section>
{{ end }}
