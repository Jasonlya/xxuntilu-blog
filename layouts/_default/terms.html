{{ define "main" }}
<header class="page-head">
  <p class="eyebrow">Topics</p>
  <h1>{{ .Title }}</h1>
  <p>按主题浏览文章，找到你关心的方向。</p>
</header>

<div class="page-body">
  {{ if .Data.Terms }}
    <div class="taxonomy-grid">
      {{ range .Data.Terms.Alphabetical }}
        <section class="taxonomy-card">
          <div class="taxonomy-card-top">
            <h2><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a></h2>
            <span class="term-count">{{ .Count }} 篇</span>
          </div>
          <ul>
            {{ range first 6 .Pages }}
              <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
            {{ end }}
          </ul>
        </section>
      {{ end }}
    </div>
  {{ else }}
    <p class="empty-state">还没有设置分类或标签。</p>
  {{ end }}
</div>
{{ end }}
